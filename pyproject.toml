[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmcert"
version = "1.0.0"
description = "Automated Quality-Control, Stationary Point Certification, and Reproducibility Assessment for Quantum-Chemical Calculations"
readme = "README.md"
authors = [
    { name = "Andre Monreal-Hernández", email = "amonreal@example.com" }
]
license = { text = "MIT" }
keywords = [
    "quantum-chemistry",
    "dft",
    "orca",
    "gaussian",
    "q-chem",
    "scf-convergence",
    "imaginary-frequencies",
    "transition-state",
    "spin-contamination",
    "thermochemistry",
    "reproducibility",
    "computational-chemistry"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "build>=0.10.0",
    "twine>=4.0.0"
]

[project.scripts]
qmcert = "qmcert.cli:main"

[project.urls]
Homepage = "https://github.com/amonreal/qmcert"
Documentation = "https://github.com/amonreal/qmcert#readme"
Repository = "https://github.com/amonreal/qmcert.git"
"Bug Tracker" = "https://github.com/amonreal/qmcert/issues"
Changelog = "https://github.com/amonreal/qmcert/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["qmcert*"]

